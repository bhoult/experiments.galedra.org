<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Browser OS — a desktop environment (windows, virtual filesystem, shell and small apps) that runs entirely in a browser tab.">
<title>Browser OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f8cff'/%3E%3Crect x='6' y='8' width='20' height='16' rx='3' fill='%230a0e1a'/%3E%3Crect x='6' y='8' width='20' height='4' rx='2' fill='%23e9edf7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles/theme.css">
<link rel="stylesheet" href="styles/os.css">
</head>
<body>
<div id="os" class="os">
  <div id="wallpaper" class="wallpaper"></div>

  <div id="desktop" class="desktop" tabindex="-1">
    <div id="desktop-icons" class="desktop-icons"></div>
  </div>

  <div id="windows" class="windows-layer"></div>
  <div id="snap-preview" class="snap-preview hidden" aria-hidden="true"></div>

  <div id="taskbar" class="taskbar">
    <button id="start-btn" class="start-btn" aria-label="Open applications menu" aria-haspopup="true" aria-expanded="false" aria-controls="start-menu">
      <span class="start-logo"></span><span class="start-label">Start</span>
    </button>
    <div id="taskbar-items" class="taskbar-items"></div>
    <div class="tray">
      <div id="tray-status" class="tray-status" title="System status"></div>
      <button id="show-desktop" class="tray-btn" title="Show desktop" aria-label="Show desktop">▾</button>
      <div id="clock" class="clock" title="Local time"></div>
    </div>
  </div>

  <div id="start-menu" class="start-menu hidden" role="dialog" aria-label="Applications menu"></div>
  <div id="context-menu" class="context-menu hidden" role="menu" aria-label="Actions"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="dialogs" class="dialogs hidden"></div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
